name: Build firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32-headless
          - esp32s3-headless
          - esp32-headless-led
          - esp32s3-mini-headless
          - esp32-headless-blox
          - esp32s3-headless-blox
          - esp32-headless-led-blox
          - esp32s3-mini-headless-blox
          - esp32-headless-officinebitcoin
          - esp32s3-headless-officinebitcoin
          - esp32-headless-led-officinebitcoin
          - esp32s3-mini-headless-officinebitcoin
          - esp32-headless-satoshispritz
          - esp32s3-headless-satoshispritz
          - esp32-headless-led-satoshispritz
          - esp32s3-mini-headless-satoshispritz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Collect firmware images
        shell: bash
        run: |
          set -euo pipefail
          output="artifact/${{ matrix.environment }}"
          mkdir -p "$output/raw" "$output/generated"
          cp .pio/build/${{ matrix.environment }}/*.bin "$output/raw/"
          if [ -d firmware ]; then
            cp -R firmware/. "$output/generated/"
          fi
          printf 'Environment: %s\nCommit: %s\n' '${{ matrix.environment }}' '${{ github.sha }}' > "$output/BUILD_INFO.txt"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: artifact/${{ matrix.environment }}
          if-no-files-found: error
          retention-days: 30

  export-diyflasher:
    name: Export diyflasher package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: false

      - name: Build diyflasher package
        run: python3 scripts/export_diyflasher.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Validate diyflasher catalog
        run: |
          python3 -m json.tool diyflasher/firmwares-easyminer.json >/dev/null
          test "$(find diyflasher/assets/easyminer -name '*.bin' | wc -l)" -eq 72

      - name: Upload diyflasher package
        uses: actions/upload-artifact@v4
        with:
          name: diyflasher-easyminer
          path: diyflasher
          if-no-files-found: error
          retention-days: 30
