name: Build firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32-headless
          - esp32s3-headless
          - esp32-headless-led
          - esp32s3-mini-headless
          - esp32-headless-blox
          - esp32s3-headless-blox
          - esp32-headless-led-blox
          - esp32s3-mini-headless-blox
          - esp32-headless-officinebitcoin
          - esp32s3-headless-officinebitcoin
          - esp32-headless-led-officinebitcoin
          - esp32s3-mini-headless-officinebitcoin
          - esp32-headless-satoshispritz
          - esp32s3-headless-satoshispritz
          - esp32-headless-led-satoshispritz
          - esp32s3-mini-headless-satoshispritz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Collect firmware images
        shell: bash
        run: |
          set -euo pipefail
          output="artifact/${{ matrix.environment }}"
          mkdir -p "$output/raw" "$output/generated"
          cp .pio/build/${{ matrix.environment }}/*.bin "$output/raw/"
          if [ -d firmware ]; then
            cp -R firmware/. "$output/generated/"
          fi
          printf 'Environment: %s\nCommit: %s\n' '${{ matrix.environment }}' '${{ github.sha }}' > "$output/BUILD_INFO.txt"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: artifact/${{ matrix.environment }}
          if-no-files-found: error
          retention-days: 30

  export-firmware:
    name: Export firmware package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Install Arduino-ESP32 framework
        run: pio pkg install --tool "platformio/framework-arduinoespressif32"

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts
          merge-multiple: false

      - name: Build firmware package
        run: python3 scripts/export_diyflasher.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Validate firmware index
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('firmware-export')
          manifest = json.loads((root / 'index.json').read_text())
          assert len(manifest['builds']) == 16
          assert len(manifest['versions']) == 1
          referenced = set()
          for build in manifest['builds']:
              assert build['files'], build['name']
              for item in build['files']:
                  path = root / item['file']
                  assert path.is_file(), path
                  assert item['sha256']
                  referenced.add(path)
          assert referenced
          assert all(path.parent.name.startswith(manifest['version'] + '_') for path in referenced)
          print(f"validated {len(manifest['builds'])} builds and {len(referenced)} files")
          PY

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: firmware-export
          path: firmware-export
          if-no-files-found: error
          retention-days: 30
