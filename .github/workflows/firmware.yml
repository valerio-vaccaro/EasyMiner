name: Build firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32-headless
          - esp32s3-headless
          - esp32-headless-led
          - esp32s3-mini-headless
          - esp32-headless-blox
          - esp32s3-headless-blox
          - esp32-headless-led-blox
          - esp32s3-mini-headless-blox

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Collect firmware images
        shell: bash
        run: |
          set -euo pipefail
          output="artifact/${{ matrix.environment }}"
          mkdir -p "$output/raw" "$output/generated"
          cp .pio/build/${{ matrix.environment }}/*.bin "$output/raw/"
          if [ -d firmware ]; then
            cp -R firmware/. "$output/generated/"
          fi
          printf 'Environment: %s\nCommit: %s\n' '${{ matrix.environment }}' '${{ github.sha }}' > "$output/BUILD_INFO.txt"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: artifact/${{ matrix.environment }}
          if-no-files-found: error
          retention-days: 30
